global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "enterprise-knowledge-agent"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000", "127.0.0.1:8000"]
        labels:
          environment: "production"
          service: "enterprise-knowledge-backend"
