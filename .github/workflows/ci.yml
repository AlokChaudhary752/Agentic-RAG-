
name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check backend evaluation mcp_servers scripts

      - name: Run Ruff Formatter Check
        run: ruff format --check backend evaluation mcp_servers scripts

      - name: Run Mypy Strict Type Check
        env:
          PYTHONPATH: backend:.
        run: mypy backend/app

  test-suite:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run Test Suite with Coverage Gate
        env:
          APP_ENV: test
          PYTHONPATH: backend:.
          QDRANT_USE_IN_MEMORY: "true"
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest backend/tests --cov=backend/app --cov-report=term --cov-report=xml --cov-fail-under=85


